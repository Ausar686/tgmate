[project]
name = "tgmate"
version = "0.1.0"
description = "Everyday tools with CLI & Telegram integration"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.14,<3.15"
dependencies = [
    "aiogram==3.32.0",
    "aiosqlite==0.22.1",
    "alembic==1.20.1",
    "pdf2docx==0.5.13",
    "pillow==13.0.0",
    "pydantic-settings==2.16.3",
    "pymupdf==1.27.2.3",
    "pypdfium2==5.15.2",
    "segno==1.6.6",
    "sqlalchemy[asyncio]==2.1.9",
    "typer==0.29.2",
]

[project.scripts]
tgmate = "tgmate.cli.app:app"

[build-system]
requires = ["uv_build==0.13.9"]
build-backend = "uv_build"

[tool.uv.build-backend]
wheel-exclude = ["**/*.md"]

[dependency-groups]
dev = [
    "bandit==1.9.4",
    "coverage==7.17.3",
    "pre-commit==4.7.0",
    "pytest==9.2.0",
    "pytest-asyncio==1.5.0",
    "ruff==0.17.5",
    "zxing-cpp==3.1.1",
]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["real_sandbox: start real worker processes instead of running sandboxed operations in-process"]
filterwarnings = [
    # PyMuPDF's SWIG bindings, on import; nothing to fix on our side.
    "ignore:builtin type Swig:DeprecationWarning",
]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "UP", "B", "I"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]
"src/tgmate/storage/migrations/versions/*.py" = ["E501", "F401"]

[tool.ruff.lint.isort]
known-first-party = ["tgmate"]

[tool.coverage.run]
branch = true
source = ["tgmate"]
omit = ["*/__main__.py"]

[tool.coverage.report]
show_missing = true
# Added to coverage's defaults (which already cover `# pragma: no cover`).
exclude_also = [
    "raise NotImplementedError",
    "if __name__ == [\"']__main__[\"']:",
    "if t.TYPE_CHECKING:",
]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]

[tool.alembic]
script_location = "%(here)s/src/tgmate/storage/migrations"
file_template = "%%(rev)s_%%(slug)s"
