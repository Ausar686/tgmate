version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    # Some dependencies (e.g. typer) ship several releases a month, often quick follow-up fixes; waiting a week
    # skips the ones that are superseded right away.
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    groups:
      runtime:
        dependency-type: production
      dev:
        dependency-type: development

  # Hook revisions in .pre-commit-config.yaml, including semgrep's.
  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    groups:
      hooks:
        patterns: ["*"]

  # Base images in .docker/Dockerfile (python, uv).
  - package-ecosystem: docker
    directory: /.docker
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    groups:
      images:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
