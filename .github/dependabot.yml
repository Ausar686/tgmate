version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    # Some dependencies (e.g. typer) ship several releases a month, often quick follow-up fixes; waiting a week
    # skips the ones that are superseded right away.
    ignore:
      # PyMuPDF 2 depends on onnxruntime and AI layout packages, which this project doesn't want without a need;
      # 1.27 has no dependencies at all. Moving to 2.x is a deliberate decision, so only 1.x updates are proposed.
      - dependency-name: pymupdf
        update-types: ["version-update:semver-major"]
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    groups:
      runtime:
        dependency-type: production
      dev:
        dependency-type: development

  # Hook revisions in .pre-commit-config.yaml, including semgrep's.
  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    groups:
      hooks:
        patterns: ["*"]

  # Base images in .docker/Dockerfile (python, uv).
  - package-ecosystem: docker
    directory: /.docker
    schedule:
      interval: weekly
    ignore:
      # The image's Python must match `requires-python` (and `.python-version`): moving to a new minor version is a
      # deliberate change to all three, so only patch releases are proposed here.
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    groups:
      images:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
