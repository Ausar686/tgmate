name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      # The office tests convert real documents. They skip without LibreOffice, but not in CI, so a failed install
      # fails them instead of hiding them. Same packages as the Docker image.
      - name: Install LibreOffice
        run: >-
          sudo apt-get update && sudo apt-get install --yes --no-install-recommends
          libreoffice-writer-nogui fonts-liberation fonts-crosextra-carlito fonts-crosextra-caladea fonts-dejavu-core
      - run: uv run coverage run -m pytest
      - run: uv run coverage report

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run bandit -c pyproject.toml -r src --severity-level medium
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - run: uv run pre-commit run semgrep --hook-stage manual --all-files

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: .docker/Dockerfile
          # Re-resolve the base images every build, so a re-published tag with security fixes is what Trivy scans.
          pull: true
          load: true
          tags: tgmate:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Migrate a fresh database inside the image
        run: >-
          docker run --rm tgmate:ci python -c
          "import asyncio; from tgmate.storage import db;
          asyncio.run(db.upgrade(db.create_engine('sqlite+aiosqlite:////data/tgmate.db')))"
      - name: Convert images to a PDF, and it to JPEGs and a DOCX, in sandboxed workers inside the image
        run: >-
          docker run --rm tgmate:ci python -c
          "import io; from PIL import Image; from tgmate.tools.pdf import PDF;
          out = io.BytesIO(); Image.new('RGB', (60, 90), 'red').save(out, 'PNG');
          pdf = PDF.from_images([out.getvalue()] * 2);
          assert PDF.page_count(pdf) == 2 and len(PDF.to_jpegs(pdf)) == 2;
          assert PDF.to_docx(pdf).startswith(b'PK')"
      - name: Run ffmpeg, ffprobe and Deno inside the image, as the YouTube worker does
        run: |
          docker run --rm -i tgmate:ci python - <<'EOF'
          import subprocess

          import deno

          from tgmate.tools.youtube import YouTube

          ffmpeg = YouTube.ffmpeg()
          for tool in ("ffmpeg", "ffprobe"):
              subprocess.run([f"{ffmpeg}/{tool}", "-version"], check=True, capture_output=True)
          # The worker's environment is empty.
          subprocess.run([deno.find_deno_bin(), "--version"], check=True, env={})
          EOF
      - name: Convert a document to PDF with LibreOffice inside the image
        run: >-
          docker run --rm tgmate:ci python -c
          "from tgmate.tools.office import Office;
          assert Office.to_pdf(rb'{\rtf1\ansi Hello\par}').startswith(b'%PDF-')"
      - name: Scan the image for fixable high/critical vulnerabilities
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.76.2
          image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 tgmate:ci
      - uses: docker/build-push-action@v7
        with:
          context: .docker
          file: .docker/bot-api.Dockerfile
          pull: true
          load: true
          tags: tgmate-bot-api:ci
          cache-from: type=gha,scope=bot-api
          cache-to: type=gha,scope=bot-api,mode=max
      - name: Start the Bot API server as the bot's user and query it
        # Made-up credentials: the server starts and answers, but no bot logs in.
        run: |
          trap 'docker rm -f bot-api > /dev/null' EXIT
          docker run -d --name bot-api -p 127.0.0.1:8081:8081 \
            -e TELEGRAM_API_ID=1 -e TELEGRAM_API_HASH=0123456789abcdef0123456789abcdef tgmate-bot-api:ci
          test "$(docker exec bot-api id -u)" = 10001
          for attempt in $(seq 30); do
            curl -s http://127.0.0.1:8081/bot1:fake/getMe | grep -q '"error_code":401' && exit 0
            sleep 1
          done
          docker logs bot-api
          exit 1
      - name: Check the compose file with and without the Bot API server
        run: |
          cp .env.example .env
          docker compose config -q
          docker compose --profile bot-api config -q
      - name: Scan the Bot API server image for fixable high/critical vulnerabilities
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.76.2
          image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 tgmate-bot-api:ci
