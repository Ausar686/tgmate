repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-json
      - id: check-yaml
      - id: check-toml
      - id: debug-statements
      - id: mixed-line-ending

  # semgrep runs in pre-commit's own environment rather than the project venv: its pinned dependencies (mcp,
  # opentelemetry) would otherwise sit in uv.lock and raise alerts we can't fix. Manual stage: CI runs it, commits
  # don't wait for it.
  - repo: https://github.com/semgrep/pre-commit
    rev: v1.186.0
    hooks:
      - id: semgrep
        args: ["--config", ".semgrep.yml", "--error", "--disable-version-check", "--quiet", "--skip-unknown-extensions"]
        files: ^src/
        stages: [manual]

  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: uv run --no-sync ruff check --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: bandit
        name: bandit
        entry: uv run --no-sync bandit -c pyproject.toml -r src --severity-level medium
        language: system
        pass_filenames: false
        always_run: true
